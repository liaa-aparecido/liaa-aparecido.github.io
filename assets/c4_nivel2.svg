<!-- Título -->
<text x="580" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4f91ff">C4 Nível 2 — Contêineres do Faro e do OPNsense</text>
<text x="580" y="48" text-anchor="middle" font-size="10" fill="#8ba3c0">O pacote chega uma vez pela igb0: Suricata recebe cópia, PF processa o original. Community ID une os dois sistemas.</text>
