<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#4f91ff"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; }
  </style>
</defs>

<!-- Fundo -->
<rect width="1000" height="660" fill="#07101c"/>

<!-- Título -->
<text x="500" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#4f91ff">C4 Nível 1 — Contexto do sistema Faro</text>
<text x="500" y="54" text-anchor="middle" font-size="11" fill="#8ba3c0">O Faro fica ao lado do firewall: lê o que o OPNsense registra e devolve regras pela API.</text>
<line x1="20" y1="64" x2="980" y2="64" stroke="#1e3050" stroke-width="1"/>

<!-- ══ FARO — centro (verde) ══ -->
<rect x="370" y="220" width="260" height="130" rx="8" fill="#0d2a1a" stroke="#22d67a" stroke-width="2"/>
<text x="500" y="240" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Sistema de software — em foco]</text>
<text x="500" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8f0fe">Faro</text>
<text x="500" y="281" text-anchor="middle" font-size="10" fill="#8ba3c0">correlaciona alertas e logs,</text>
<text x="500" y="295" text-anchor="middle" font-size="10" fill="#8ba3c0">filtra por listas negras e</text>
<text x="500" y="309" text-anchor="middle" font-size="10" fill="#8ba3c0">propõe regras de bloqueio com IA</text>
<text x="500" y="341" text-anchor="middle" font-size="10" fill="#22d67a">VM Debian · Python 3.12</text>

<!-- ══ INTERNET — topo ══ -->
<rect x="370" y="88" width="260" height="88" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="2"/>
<text x="500" y="106" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Origens externas]</text>
<text x="500" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8f0fe">Internet</text>
<text x="500" y="151" text-anchor="middle" font-size="10" fill="#8ba3c0">varreduras, exploits, bots</text>
<text x="500" y="167" text-anchor="middle" font-size="10" fill="#8ba3c0">40+ países · 6.725 IPs únicos</text>

<!-- ══ ANALISTA TI — esquerda ══ -->
<rect x="60" y="230" width="175" height="110" rx="8" fill="#0d1f3a" stroke="#4f91ff" stroke-width="2"/>
<text x="147" y="250" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Pessoa]</text>
<text x="147" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8f0fe">Analista de TI</text>
<text x="147" y="295" text-anchor="middle" font-size="10" fill="#8ba3c0">acompanha o funil e</text>
<text x="147" y="309" text-anchor="middle" font-size="10" fill="#8ba3c0">aprova os bloqueios</text>
<text x="147" y="328" text-anchor="middle" font-size="10" fill="#4f91ff">navegador · http://:8080</text>

<!-- ══ OPNSENSE — direita cima ══ -->
<rect x="740" y="168" width="210" height="118" rx="8" fill="#0d1f30" stroke="#8ba3c0" stroke-width="2"/>
<text x="845" y="186" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Sistema existente]</text>
<text x="845" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8f0fe">OPNsense</text>
<text x="845" y="230" text-anchor="middle" font-size="10" fill="#8ba3c0">firewall PF + Suricata IDS</text>
<text x="845" y="245" text-anchor="middle" font-size="10" fill="#8ba3c0">interface WAN igb0</text>
<text x="845" y="260" text-anchor="middle" font-size="10" fill="#8ba3c0">OPNsense 26.7.8 · igb0</text>
<text x="845" y="276" text-anchor="middle" font-size="10" fill="#8ba3c0">172.16.0.1</text>

<!-- ══ SERVIDORES EXPOSTOS — direita baixo ══ -->
<rect x="740" y="336" width="210" height="100" rx="8" fill="#0d1f30" stroke="#8ba3c0" stroke-width="2"/>
<text x="845" y="354" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Sistema existente]</text>
<text x="845" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8f0fe">Servidores expostos</text>
<text x="845" y="396" text-anchor="middle" font-size="10" fill="#8ba3c0">web, DNS, honeypot em DMZ</text>
<text x="845" y="412" text-anchor="middle" font-size="10" fill="#8ba3c0">172.16.0.x / DMZ</text>

<!-- ══ FONTES EXTERNAS — linha inferior ══ -->
<!-- AbuseIPDB -->
<rect x="30"  y="490" width="155" height="90" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="107"  y="508" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Serviço externo]</text>
<text x="107"  y="533" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f0fe">AbuseIPDB</text>
<text x="107"  y="550" text-anchor="middle" font-size="10" fill="#8ba3c0">reputação de IPs</text>
<text x="107"  y="566" text-anchor="middle" font-size="10" fill="#8ba3c0">414.244 IPs · score 100</text>

<!-- Spamhaus DROP -->
<rect x="203" y="490" width="155" height="90" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="280"  y="508" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Lista externa]</text>
<text x="280"  y="533" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f0fe">Spamhaus DROP</text>
<text x="280"  y="550" text-anchor="middle" font-size="10" fill="#8ba3c0">blocos CIDR hostis</text>
<text x="280"  y="566" text-anchor="middle" font-size="10" fill="#8ba3c0">1.767 CIDRs</text>

<!-- Modelo de IA -->
<rect x="376" y="490" width="155" height="90" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="453"  y="508" text-anchor="middle" font-size="9"  fill="#8ba3c0">[LLM online ou local]</text>
<text x="453"  y="533" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f0fe">Modelo de IA</text>
<text x="453"  y="550" text-anchor="middle" font-size="10" fill="#8ba3c0">seleciona candidatos</text>
<text x="453"  y="566" text-anchor="middle" font-size="10" fill="#8ba3c0">a bloqueio</text>

<!-- Listas de assinaturas -->
<rect x="549" y="490" width="155" height="90" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="626"  y="508" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Fonte externa]</text>
<text x="626"  y="528" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f0fe">Listas de assinaturas</text>
<text x="626"  y="546" text-anchor="middle" font-size="10" fill="#8ba3c0">ataques conhecidos</text>
<text x="626"  y="562" text-anchor="middle" font-size="10" fill="#8ba3c0">Emerging Threats · ET PRO</text>
<text x="626"  y="577" text-anchor="middle" font-size="10" fill="#8ba3c0">CVE-2021-35394 (Realtek)</text>

<!-- CrowdSec -->
<rect x="722" y="490" width="155" height="90" rx="8" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="799"  y="508" text-anchor="middle" font-size="9"  fill="#8ba3c0">[Serviço externo]</text>
<text x="799"  y="533" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8f0fe">CrowdSec</text>
<text x="799"  y="550" text-anchor="middle" font-size="10" fill="#8ba3c0">blocklist colaborativa</text>
<text x="799"  y="566" text-anchor="middle" font-size="10" fill="#8ba3c0">8.328 IPs ativos</text>

<!-- ══ SETAS ══ -->
<!-- Internet → OPNsense -->
<line x1="630" y1="132" x2="740" y2="195" stroke="#4f91ff" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="694" y="156" text-anchor="middle" font-size="9" fill="#8ba3c0">tráfego</text>

<!-- OPNsense → Faro (lê alertas e logs) -->
<line x1="740" y1="215" x2="630" y2="258" stroke="#4f91ff" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="690" y="228" text-anchor="middle" font-size="9" fill="#8ba3c0">lê alertas e logs</text>

<!-- Faro → OPNsense (cria regras via API) -->
<line x1="630" y1="275" x2="740" y2="248" stroke="#4f91ff" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<text x="690" y="273" text-anchor="middle" font-size="9" fill="#8ba3c0">cria regras [API REST]</text>

<!-- OPNsense → Servidores -->
<line x1="845" y1="286" x2="845" y2="336" stroke="#8ba3c0" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="878" y="316" font-size="9" fill="#8ba3c0">encaminha</text>
<text x="878" y="329" font-size="9" fill="#8ba3c0">tráfego permitido</text>

<!-- Analista → Faro -->
<line x1="235" y1="278" x2="370" y2="270" stroke="#4f91ff" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="300" y="262" text-anchor="middle" font-size="9" fill="#8ba3c0">valida e aprova</text>

<!-- AbuseIPDB → Faro -->
<line x1="107" y1="490" x2="385" y2="348" stroke="#4f91ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<text x="216" y="400" text-anchor="middle" font-size="9" fill="#8ba3c0">consulta [HTTPS]</text>

<!-- Spamhaus → Faro -->
<line x1="358" y1="490" x2="415" y2="350" stroke="#4f91ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<text x="372" y="430" text-anchor="middle" font-size="9" fill="#8ba3c0">baixa a lista</text>

<!-- Modelo IA → Faro -->
<line x1="453" y1="490" x2="470" y2="350" stroke="#4f91ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<text x="490" y="435" text-anchor="middle" font-size="9" fill="#8ba3c0">envia IPs restantes</text>

<!-- Listas assinaturas → OPNsense -->
<line x1="704" y1="490" x2="800" y2="286" stroke="#4f91ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<text x="762" y="378" text-anchor="middle" font-size="9" fill="#8ba3c0">atualizam o Suricata</text>

<!-- CrowdSec → Faro -->
<line x1="799" y1="490" x2="615" y2="350" stroke="#4f91ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
<text x="724" y="440" text-anchor="middle" font-size="9" fill="#8ba3c0">blocklist</text>

<!-- ══ LEGENDA ══ -->
<line x1="20" y1="626" x2="980" y2="626" stroke="#1e3050" stroke-width="1"/>
<rect x="30"  y="635" width="12" height="12" rx="2" fill="#0d2a1a" stroke="#22d67a" stroke-width="2"/>
<text x="47"  y="646" font-size="11" fill="#8ba3c0">Sistema em foco (Faro)</text>
<rect x="195" y="635" width="12" height="12" rx="2" fill="#0d1f3a" stroke="#4f91ff" stroke-width="2"/>
<text x="212" y="646" font-size="11" fill="#8ba3c0">Pessoa</text>
<rect x="285" y="635" width="12" height="12" rx="2" fill="#0d1f30" stroke="#8ba3c0" stroke-width="2"/>
<text x="302" y="646" font-size="11" fill="#8ba3c0">Sistema existente na rede</text>
<rect x="490" y="635" width="12" height="12" rx="2" fill="#0a1520" stroke="#4a5568" stroke-width="1.5"/>
<text x="507" y="646" font-size="11" fill="#8ba3c0">Externo ao laboratório</text>
<line x1="680" y1="641" x2="710" y2="641" stroke="#4f91ff" stroke-width="1.5"/>
<text x="715" y="646" font-size="11" fill="#8ba3c0">síncrona</text>
<line x1="790" y1="641" x2="820" y2="641" stroke="#4f91ff" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="825" y="646" font-size="11" fill="#8ba3c0">assíncrona</text>
</svg>
